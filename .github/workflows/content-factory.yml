name: Content Factory — Scheduled Generation

on:
  schedule:
    # 08:00 UTC daily trigger; generation runs every other day (see Decide generation mode).
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of articles to generate'
        default: '1'
      mock:
        description: 'Use mock generator (pipeline test only — not for production)'
        type: boolean
        default: false
      publish_mock:
        description: 'Commit mock articles to main (requires mock=true; no Claude API needed)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

# Prevent parallel runs racing on the same branch push
concurrency:
  group: content-factory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Decide generation mode
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INPUT_MOCK: ${{ github.event.inputs.mock }}
          PUBLISH_MOCK: ${{ github.event.inputs.publish_mock }}
          EVENT_NAME: ${{ github.event_name }}
        run: bash content-factory/scripts/decide-generation-mode.sh

      - uses: actions/setup-node@v6
        if: steps.gen.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        with:
          node-version: '24'

      - name: Install dependencies
        if: steps.gen.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: cd content-factory && npm install

      - name: Initialize content factory
        if: steps.gen.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: cd content-factory && npm run init
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          SITE_BASE_URL: https://rentiers.net
          CONTENT_DIR: ../content/blog
          SITE_PUBLIC_DIR: ../public

      - name: Show queue before generation
        id: queue
        if: steps.gen.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          cd content-factory
          npm run queue:list
          npx tsx src/index.ts queue stats
          PENDING=$(node -pe "JSON.parse(require('fs').readFileSync('queue/pending.json','utf8')).length")
          echo "pending=$PENDING" >> "$GITHUB_OUTPUT"
          # The live cron has a key and an empty queue; batch used to mint fallback-* anyway.
          if [ "$PENDING" = "0" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "skip_fallback=true" >> "$GITHUB_OUTPUT"
            echo "📋 Scheduled run: queue is empty — will not publish a fallback article"
          else
            echo "skip_fallback=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate safe-fallback templates
        if: steps.gen.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: cd content-factory && npm run test:fallback

      - name: Run integration test
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: cd content-factory && npm run test
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          FROM_EMAIL: onboarding@resend.dev
          SITE_BASE_URL: https://rentiers.net
          CONTENT_DIR: ../content/blog
          SITE_PUBLIC_DIR: ../public

      - name: Generate articles batch
        id: batch
        if: steps.gen.outputs.run == 'true' && steps.gen.outputs.mode != 'fallback-only' && steps.queue.outputs.skip_fallback != 'true'
        continue-on-error: true
        run: |
          cd content-factory
          MOCK_FLAG=""
          if [ "${{ steps.gen.outputs.mode }}" = "mock" ]; then
            MOCK_FLAG="--mock"
            echo "Using mock generator (explicit publish_mock)"
          else
            echo "Using Claude API"
          fi
          npm run batch -- -n ${{ github.event.inputs.count || '1' }} $MOCK_FLAG
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          FROM_EMAIL: onboarding@resend.dev
          SITE_BASE_URL: https://rentiers.net
          CONTENT_DIR: ../content/blog
          SITE_PUBLIC_DIR: ../public
          CONTENT_FACTORY_SCHEDULED: ${{ github.event_name == 'schedule' }}

      - name: Publish safe fallback if no new article
        if: steps.gen.outputs.run == 'true' && steps.queue.outputs.skip_fallback != 'true'
        run: |
          cd content-factory
          npx tsx src/index.ts fallback --only-if-missing --reason "ci-safety-net (mode=${{ steps.gen.outputs.mode }}, batch=${{ steps.batch.outcome }})"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          FROM_EMAIL: onboarding@resend.dev
          SITE_BASE_URL: https://rentiers.net
          CONTENT_DIR: ../content/blog
          SITE_PUBLIC_DIR: ../public

      - name: Show generated files
        if: steps.gen.outputs.run == 'true' && steps.queue.outputs.skip_fallback != 'true'
        run: |
          echo "=== New/updated blog files ==="
          git status --short content/blog/ public/sitemap.xml public/llms.txt content-factory/queue/ || true
          ls -la content/blog/*.mdx | tail -5 || true

      - name: Commit and push generated articles
        if: steps.gen.outputs.run == 'true' && steps.queue.outputs.skip_fallback != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/blog/ public/sitemap.xml public/llms.txt content-factory/queue/
          if git diff --staged --quiet; then
            TODAY=$(date -u +%F)
            if ls content/blog/fallback-*-"$TODAY".mdx >/dev/null 2>&1; then
              echo "No new files to commit — today's fallback is already in the repo."
              exit 0
            fi
            echo "::error::No article files to commit — generation and fallback both produced nothing. Check logs above."
            exit 1
          fi
          git commit -m "feat(blog): content factory generated articles"
          git fetch origin ${{ github.ref_name }}
          if ! git pull --rebase origin ${{ github.ref_name }}; then
            echo "::error::Rebase failed — main changed during generation. Aborting."
            git rebase --abort || true
            exit 1
          fi
          git push origin HEAD:${{ github.ref_name }}

      - name: Trigger GitHub Pages deploy
        if: steps.gen.outputs.run == 'true' && steps.queue.outputs.skip_fallback != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering deploy workflow (GITHUB_TOKEN pushes do not auto-trigger deploy.yml)..."
          gh workflow run deploy.yml --ref "${{ github.ref_name }}"

      - name: Skip empty scheduled queue
        if: steps.queue.outputs.skip_fallback == 'true'
        run: |
          echo "Generation skipped: scheduled run and the content queue is empty."
          echo "Not publishing a fallback-* article."
          echo "Add articles to the content plan to resume scheduled publishing."

      - name: Skip summary
        if: steps.gen.outputs.run != 'true'
        run: |
          echo "Generation skipped (${{ steps.gen.outputs.mode }})."
          echo "For real Claude articles: set repo secret ANTHROPIC_API_KEY (optional ANTHROPIC_MODEL)."
          echo "Pipeline test without Claude: workflow_dispatch with mock=true + publish_mock=true."
          echo "Manual fallback only (no Claude): workflow_dispatch without mock (mode=fallback-only)."
          echo "Scheduled runs with a missing key fail closed (mode=missing-key) and do not publish a fallback."
